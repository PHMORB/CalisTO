<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calisto — Coach de callisthénie</title>
<meta name="description" content="Calisthenics coach: guided workouts, step-by-step progressions and progress tracking.">
<meta name="theme-color" content="#0c0f14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calisto">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0f14; --bg2:#131821; --card:#181e29; --card2:#1f2734; --line:#2a3342;
  --tx:#eef2f7; --tx2:#a7b1c2; --tx3:#6f7b8f;
  --acc:#ff6b35; --acc2:#ff9a62; --teal:#2ec4b6; --lime:#b8f55a; --red:#ff5470; --gold:#ffc857;
  --r:18px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.45}
h1,h2,h3,.cond{font-family:"Barlow Condensed",Inter,sans-serif;letter-spacing:.2px;margin:0}
h2{font-size:26px;font-weight:700}
h3{font-size:20px;font-weight:700}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:var(--teal)}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:rgba(12,15,20,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:var(--safe-t)}
header.top .wrap{display:flex;align-items:center;gap:12px;height:58px}
.logo{display:flex;align-items:center;gap:8px;font-family:"Barlow Condensed";font-weight:800;font-size:24px;letter-spacing:1px}
.logo b{color:var(--acc)}
.sync{margin-left:auto;font-size:12px;color:var(--tx3);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--tx3)}
.dot.ok{background:var(--teal)} .dot.local{background:var(--gold)}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(19,24,33,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav.tabs .wrap{display:flex;justify-content:space-around}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 10px;font-size:12px;color:var(--tx3);font-weight:600}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--acc)}
main{padding:18px 0 110px}
.view{display:none}.view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:620px){.g4{grid-template-columns:repeat(2,1fr)}}
.muted{color:var(--tx2)} .small{font-size:13px} .tiny{font-size:12px;color:var(--tx3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-weight:600}
.btn:hover{border-color:#3a4659}
.btn.pri{background:linear-gradient(135deg,var(--acc),#ff4d4d);border:0;color:#fff;box-shadow:0 8px 24px -8px rgba(255,107,53,.6)}
.btn.teal{background:var(--teal);color:#062421;border:0}
.btn.big{padding:16px 22px;font-size:17px;border-radius:16px}
.btn.block{width:100%}
.btn.ghost{background:transparent}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-weight:600;font-size:14px}
.chip.on{background:rgba(255,107,53,.16);border-color:var(--acc);color:var(--acc2)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--card2);color:var(--tx2)}
.pill.acc{background:rgba(255,107,53,.15);color:var(--acc2)}
.pill.teal{background:rgba(46,196,182,.15);color:var(--teal)}
.pill.gold{background:rgba(255,200,87,.15);color:var(--gold)}
label.fld{display:block;font-size:13px;color:var(--tx2);margin:0 0 8px;font-weight:600}
input[type=range]{width:100%;accent-color:var(--acc)}
.sec{margin:26px 0 12px;display:flex;align-items:end;justify-content:space-between;gap:10px}
.hero{position:relative;border-radius:24px;overflow:hidden;border:1px solid var(--line);min-height:230px}
.hero svg.scene{position:absolute;inset:0;width:100%;height:100%}
.hero .txt{position:relative;padding:24px 22px;max-width:60%}
.hero h1{font-size:40px;line-height:1;font-weight:800;text-transform:uppercase}
.hero h1 em{font-style:normal;color:var(--acc)}
@media(max-width:620px){.hero .txt{max-width:70%}.hero h1{font-size:32px}}
.fig{width:100%;display:block}
.figbox>.fig{position:absolute;inset:0;width:100%;height:100%}
.figbox{background:radial-gradient(120% 90% at 50% 0%,#253145 0%,#151b26 70%);border-radius:14px;overflow:hidden;position:relative}
.famcard{cursor:pointer;padding:0;overflow:hidden;transition:transform .15s,border-color .15s}
.famcard:hover{transform:translateY(-2px);border-color:#3a4659}
.famcard .figbox{border-radius:0;aspect-ratio:4/3}
.famcard .bd{padding:12px 14px 14px}
.lvlbar{height:7px;border-radius:9px;background:var(--card2);overflow:hidden;margin-top:8px}
.lvlbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--lime));border-radius:9px}
.steps{position:relative;padding-left:28px}
.steps:before{content:"";position:absolute;left:11px;top:8px;bottom:8px;width:2px;background:var(--line)}
.step{position:relative;margin-bottom:14px}
.step .num{position:absolute;left:-28px;top:14px;width:24px;height:24px;border-radius:50%;background:var(--card2);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--tx2)}
.step.done .num{background:var(--teal);border-color:var(--teal);color:#062421}
.step.cur .num{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 0 0 5px rgba(255,107,53,.2)}
.step .card{display:grid;grid-template-columns:160px 1fr;gap:14px;align-items:start}
.step.cur .card{border-color:rgba(255,107,53,.55)}
@media(max-width:620px){.step .card{grid-template-columns:1fr}}
ul.cues{margin:8px 0 0;padding-left:18px;color:var(--tx2);font-size:14px}
ul.cues li{margin:2px 0}
.yt{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;color:#fff;background:#c4302b;padding:7px 11px;border-radius:10px;text-decoration:none}
.stat .v{font-family:"Barlow Condensed";font-size:34px;font-weight:700;line-height:1}
.stat .l{font-size:12px;color:var(--tx3);text-transform:uppercase;letter-spacing:.6px;margin-top:4px}
.hist{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.hist:last-child{border-bottom:0}
.hist .d{width:48px;text-align:center;font-family:"Barlow Condensed";line-height:1}
.hist .d b{display:block;font-size:24px}
.hist .d span{font-size:12px;color:var(--tx3);text-transform:uppercase}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.sw{width:48px;height:28px;border-radius:99px;background:var(--card2);border:1px solid var(--line);position:relative;flex:none;transition:.2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--tx3);transition:.2s}
.sw.on{background:var(--teal);border-color:var(--teal)}
.sw.on:after{left:23px;background:#fff}
select{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;width:100%}
/* overlays */
.ov{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column;overflow:auto}
.ov.on{display:flex}
.modal{position:fixed;inset:0;z-index:70;background:rgba(5,7,10,.72);display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.modal .box{background:var(--bg2);border:1px solid var(--line);border-radius:22px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:22px}
/* coach */
.co-top{padding:calc(10px + var(--safe-t)) 16px 8px;display:flex;align-items:center;gap:12px}
.co-prog{flex:1;height:8px;background:var(--card2);border-radius:9px;overflow:hidden}
.co-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--gold));transition:width .4s}
.co-main{flex:1;display:flex;flex-direction:column;max-width:720px;width:100%;margin:0 auto;padding:0 16px calc(16px + var(--safe-b))}
.phase{font-family:"Barlow Condensed";text-transform:uppercase;letter-spacing:2px;font-weight:700;font-size:15px;color:var(--acc2)}
.phase.rest{color:var(--teal)} .phase.warm{color:var(--gold)}
.co-fig{border-radius:22px;aspect-ratio:4/3;max-height:42vh;margin:8px auto;width:100%}
.co-fig .fig{height:100%}
.co-name{font-family:"Barlow Condensed";font-size:32px;font-weight:800;line-height:1.05;text-align:center}
.co-target{text-align:center;color:var(--tx2);font-weight:600;margin-top:4px}
.co-timer{font-family:"Barlow Condensed";font-size:84px;font-weight:800;text-align:center;line-height:1;margin:6px 0;font-variant-numeric:tabular-nums}
.co-timer.rest{color:var(--teal)}
.bubble{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:8px 0}
.bubble .av{width:38px;height:38px;border-radius:50%;flex:none;background:linear-gradient(135deg,var(--acc),var(--gold));display:flex;align-items:center;justify-content:center;font-weight:800;font-family:"Barlow Condensed";font-size:20px;color:#fff}
.bubble p{margin:0;font-size:15px}
.co-ctrl{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:10px;flex-wrap:wrap}
.round{width:56px;height:56px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.round svg{width:24px;height:24px}
.stepper{display:flex;align-items:center;gap:14px;justify-content:center}
.stepper button{width:46px;height:46px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-size:24px;font-weight:700}
.stepper .val{font-family:"Barlow Condensed";font-size:40px;font-weight:800;min-width:70px;text-align:center}
.logbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center;margin-top:8px}
.next{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;margin-top:8px}
.next .figbox{width:96px;flex:none;aspect-ratio:4/3}
.plan-row{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.plan-row:last-child{border-bottom:0}
.plan-row .t{margin-left:auto;color:var(--tx3);font-variant-numeric:tabular-nums}
.tag{width:8px;height:8px;border-radius:50%;flex:none}
.res-row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.lvup{background:linear-gradient(135deg,rgba(184,245,90,.12),rgba(46,196,182,.12));border:1px solid rgba(184,245,90,.4);border-radius:14px;padding:12px;margin-top:10px}
.note{font-size:12.5px;color:var(--tx3);border-left:3px solid var(--line);padding-left:10px;margin-top:12px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;z-index:90;font-weight:600;font-size:14px;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--tx2);font-weight:600;margin-bottom:12px}
.kicker{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--tx3);font-weight:700}
.pulse{animation:pulse 1s ease infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
</style>
<style>
.langbtn{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;border-radius:16px;background:var(--card2);border:1px solid var(--line);font-size:18px;font-weight:700;margin-top:10px;text-align:left}
.langbtn:hover,.langbtn.on{border-color:var(--acc)}
.langbtn .fl{font-size:28px}
.langsw{display:flex;gap:6px}
@media(max-width:560px){.sync span:last-child{display:none}.langsw button{padding:5px 7px}}
.langsw button{padding:5px 9px;border-radius:9px;font-size:12px;font-weight:700;color:var(--tx3);border:1px solid var(--line)}
.langsw button.on{color:var(--acc2);border-color:var(--acc)}
.hist{cursor:pointer}
.hist:hover{background:rgba(255,255,255,.02)}
table.det{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
table.det td,table.det th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.det th{font-size:12px;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.setpill{display:inline-block;min-width:34px;text-align:center;padding:3px 7px;border-radius:8px;background:var(--card2);margin:2px;font-variant-numeric:tabular-nums;font-weight:600;font-size:13px}
.setpill.ok{background:rgba(46,196,182,.18);color:var(--teal)}
.tips{font-size:13px;color:var(--tx2);line-height:1.6;background:var(--card2);border-radius:12px;padding:12px;margin-top:10px}
.qual{font-size:11px;font-weight:700;padding:2px 7px;border-radius:7px}
.qual.hi{background:rgba(46,196,182,.18);color:var(--teal)}.qual.mid{background:rgba(255,200,87,.15);color:var(--gold)}.qual.lo{background:rgba(255,84,112,.15);color:var(--red)}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="logo"><svg width="28" height="28" viewBox="0 0 28 28"><rect x="2" y="5" width="24" height="3.4" rx="1.7" fill="#ff6b35"/><circle cx="14" cy="13.5" r="3.2" fill="#eef2f7"/><path d="M8 6.7l3.5 9.5M20 6.7l-3.5 9.5M14 16.5v6M14 22.5l-4 3.5M14 22.5l4 3.5" stroke="#eef2f7" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg><span>CALIS<b>TO</b></span></div>
  <div class="sync" id="sync"><span class="dot"></span><span></span></div>
  <div class="langsw" id="langSw"></div>
</div></header>

<main class="wrap">
  <section class="view" id="v-accueil">
    <div class="hero" id="hero"></div>
    <div class="sec"><h2 data-t="new_session"></h2><span class="tiny" id="lastSeen"></span></div>
    <div class="card">
      <label class="fld"><span data-t="duration_total"></span> : <span id="durLbl" style="color:var(--acc2)">30 min</span></label>
      <div class="chips" id="durChips"></div>
      <input type="range" id="durRange" min="10" max="90" step="5" value="30" style="margin-top:12px">
      <label class="fld" style="margin-top:16px" data-t="goal"></label>
      <div class="chips" id="focusChips"></div>
      <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap">
        <button class="btn pri big" id="btnPlan" style="flex:1;min-width:200px"><svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M7 4.5v15l13-7.5z"/></svg><span data-t="prepare"></span></button>
      </div>
      <div class="tiny" style="margin-top:10px" id="equipLine"></div>
    </div>
    <div class="sec"><h2 data-t="this_week"></h2><a href="#progres" class="small" data-t="see_progress"></a></div>
    <div class="grid g4" id="homeStats"></div>
    <div class="sec"><h2 data-t="my_levels"></h2><a href="#mouvements" class="small" data-t="all_moves"></a></div>
    <div class="grid g3" id="homeLevels"></div>
  </section>

  <section class="view" id="v-mouvements">
    <div id="libList">
      <h2 data-t="moves_title"></h2>
      <p class="muted" style="margin:6px 0 14px" data-t="moves_intro"></p>
      <div class="chips" id="catChips" style="margin-bottom:14px"></div>
      <div class="grid g3" id="famGrid"></div>
      <div class="sec"><h2 data-t="warm_cool"></h2></div>
      <div class="grid g3" id="extraGrid"></div>
    </div>
    <div id="libDetail" style="display:none"></div>
  </section>

  <section class="view" id="v-progres">
    <h2 data-t="progress_title"></h2>
    <div class="grid g4" style="margin-top:14px" id="progStats"></div>
    <div class="sec"><h3 data-t="history"></h3><span class="tiny" data-t="hist_hint"></span></div>
    <div class="card" id="histList"></div>
    <div class="sec"><h3 data-t="week_chart"></h3></div>
    <div class="card" id="weekChart"></div>
    <div class="sec"><h3 data-t="fam_trend"></h3><span class="tiny" data-t="best_set"></span></div>
    <div class="grid g2" id="famTrends"></div>
  </section>

  <section class="view" id="v-reglages">
    <h2 data-t="settings_title"></h2>
    <div class="sec"><h3 data-t="language"></h3></div>
    <div class="card"><div class="chips" id="langSet"></div></div>
    <div class="sec"><h3 data-t="coach"></h3></div>
    <div class="card" id="coachSet"></div>
    <div class="sec"><h3 data-t="my_equip"></h3></div>
    <div class="card" id="equipSet"></div>
    <div class="sec"><h3 data-t="global_level"></h3></div>
    <div class="card">
      <p class="muted small" style="margin-top:0" data-t="global_level_p"></p>
      <div class="chips" id="lvlPreset"></div>
    </div>
    <div class="sec"><h3 data-t="my_data"></h3></div>
    <div class="card">
      <p class="muted small" style="margin-top:0" id="dataInfo"></p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn sm" id="btnCopy" data-t="copy_data"></button>
        <button class="btn sm" id="btnImport" data-t="import_data"></button>
        <button class="btn sm" id="btnReset" style="color:var(--red)" data-t="erase_all"></button>
      </div>
    </div>
    <p class="note" data-t="disclaimer"></p>
  </section>
</main>

<nav class="tabs"><div class="wrap" id="tabs"></div></nav>

<div class="ov" id="coach">
  <div class="co-top">
    <button class="round" id="coClose" style="width:42px;height:42px" aria-label="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="co-prog"><i id="coProg"></i></div>
    <div class="small" style="font-variant-numeric:tabular-nums;min-width:92px;text-align:right"><span id="coElapsed">0:00</span> / <span class="muted" id="coTotal">0:00</span></div>
  </div>
  <div class="co-main" id="coMain"></div>
</div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>
<script>
/* ===== CATALOGUE TRILINGUE [fr, en, es] ===== */
const CATS=[
 {id:"poussee",n:["Poussée","Push","Empuje"],c:"#ff6b35"},
 {id:"tirage",n:["Tirage","Pull","Tracción"],c:"#2ec4b6"},
 {id:"jambes",n:["Jambes","Legs","Piernas"],c:"#b8f55a"},
 {id:"core",n:["Gainage","Core","Core"],c:"#ffc857"},
 {id:"skill",n:["Figures","Skills","Habilidades"],c:"#a78bfa"}];
const R=(s,r,side)=>({type:"reps",sets:s,reps:r,side:!!side});
const H=(s,sec)=>({type:"hold",sets:s,secs:sec});
const FAMILIES=[
 {id:"pompes",n:["Pompes","Push-ups","Flexiones"],cat:"poussee",eq:[],d:["La base de la poussée horizontale : pectoraux, triceps, épaules et gainage.","The foundation of horizontal pushing: chest, triceps, shoulders and core.","La base del empuje horizontal: pecho, tríceps, hombros y core."],steps:[

  {n:["Pompes inclinées","Incline push-ups","Flexiones inclinadas"],p:"inclinepush",g:R(3,15),d:["Mains sur un banc, une table ou le comptoir. Plus l'appui est bas, plus c'est difficile.","Hands on a bench, table or counter. The lower the support, the harder it gets.","Manos en un banco, mesa o encimera. Cuanto más bajo el apoyo, más difícil."],c:[["Fessiers serrés, abdos engagés","Glutes squeezed, abs braced","Glúteos apretados, abdomen firme"],["Poitrine qui touche l'appui","Chest touches the support","El pecho toca el apoyo"],["Pousser le sol loin de soi en haut","Push the support away at the top","Empuja lejos el apoyo arriba"]]},

  {n:["Pompes complètes","Full push-ups","Flexiones completas"],p:"pushup",g:R(3,12),d:["La pompe classique. Objectif : 3 séries de 12 avec une technique propre.","The classic push-up. Goal: 3 sets of 12 with clean form.","La flexión clásica. Meta: 3 series de 12 con técnica limpia."],c:[["Gainage total, pas de dos creux","Full-body tension, no sagging hips","Cuerpo firme, sin hundir la cadera"],["Coudes à 45°, avant-bras verticaux","Elbows at 45°, forearms vertical","Codos a 45°, antebrazos verticales"],["Poitrine à un poing du sol","Chest a fist from the floor","Pecho a un puño del suelo"]]},
  {n:["Pompes diamant","Diamond push-ups","Flexiones diamante"],p:"diamond",g:R(3,12),d:["Mains rapprochées sous la poitrine, pouces et index en losange. Plus de triceps.","Hands together under the chest, thumbs and index fingers form a diamond. More triceps.","Manos juntas bajo el pecho formando un diamante. Más tríceps."],c:[["Coudes qui frôlent le tronc","Elbows brush your ribs","Codos rozando el torso"],["Mains sous le sternum","Hands under the sternum","Manos bajo el esternón"],["Descente contrôlée de 2 s","2-second controlled descent","Bajada controlada de 2 s"]]},
  {n:["Pompes archer","Archer push-ups","Flexiones arquero"],p:"pushup",g:R(3,8,1),d:["Mains très larges : on descend vers un bras pendant que l'autre reste tendu.","Very wide hands: lower toward one arm while the other stays straight.","Manos muy abiertas: baja hacia un brazo mientras el otro queda recto."],c:[["Bras d'appui tendu, paume à plat","Assisting arm straight, palm flat","Brazo de apoyo recto, palma plana"],["Hanches parallèles au sol","Hips parallel to the floor","Cadera paralela al suelo"],["Alterner les côtés","Alternate sides","Alterna los lados"]]},

let LI=0;
function t(k,v){let s=(L[k]&&(L[k][LI]??L[k][0]))??k;if(v)for(const x in v)s=s.split("{"+x+"}").join(v[x]);return s}

function ik(a,b,l1,l2,sign){

function closedPath(pts){
  const n=pts.length;let d=`M${f1(pts[0][0])} ${f1(pts[0][1])}`;
  for(let i=0;i<n;i++){const p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n],p3=pts[(i+2)%n];

    d+=`C${f1(c1[0])} ${f1(c1[1])} ${f1(c2[0])} ${f1(c2[1])} ${f1(p2[0])} ${f1(p2[1])}`}

}
// segment musclé : épaisseurs r1→r2, renflement (bulge) à la fraction « at », biais d'un côté
function limb(p1,p2,r1,r2,fill,bulge=0,at=.38,bias=0){
  const d=nrm(sub(p2,p1)),n=perp(d),m=lerp(p1,p2,at),rm=r1+(r2-r1)*at;

const circ=(p,r,fill)=>`<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="${r}" fill="${fill}"/>`;
function ptOf(P,k){if(Array.isArray(k))return k;if(P[k])return P[k];if(k==="w2")return add(P.w,[5,0]);if(k==="a2")return add(P.a,[5,0]);return null}
function limbs(P){

  const eb=P.eb??-1,kb=P.kb??1,eb2=P.eb2??eb,kb2=P.kb2??kb;
  const s2=add(P.s,[4,-1]),hp2=add(P.hp,[4,-1]);

function footVec(knee,ankle,P){

  const d=nrm(sub(ankle,knee));let c=[-d[1],d[0]];const face=P.face??-1;

function faceDir(P){const ax=nrm(sub(P.s,P.hp));let f=[ax[1],-ax[0]];if((P.fd??1)<0)f=mul(f,-1);return f}
function torsoPath(P,t0,t1,grow,fdv){

  const c=t=>add(add(P.hp,mul(u,L0*t)),mul(n,-fs*sp*Math.sin(Math.PI*t)*7));

function drawArm(s,A,col,colD,front){

  g+=limb(s,A.j,6.6,4.8,col,1.5,.42);

  if(front)g+=circ(s,7.4,col)+`<path d="${closedPath([add(s,[-5,-3]),add(s,[0,-6.5]),add(s,[5,-3]),add(s,[0,1])])}" fill="${colD}" opacity=".25"/>`;

function drawLeg(hp,Lg,P,cols,front){

function drawFigure(P){

  g+=circ(add(add(hd,mul(fdv,1.5)),mul(ax,-1.1)),8.5,COL.skin);

const LS_KEY="calisto_v1";
const DEFAULT_STATE=()=>({settings:{lang:null,equip:{barre:true,paralleles:true,basse:true},voice:true,beeps:true,rest:"normal",dur:30,focus:"complet",onboarded:false,rate:1,pitch:1,voiceIds:{},baseLevels:null},levels:Object.fromEntries(FAMILIES.map(f=>[f.id,0])),sessions:[],active:null});
let S=DEFAULT_STATE();
const store={mode:"local",db:null,uid:null,profRef:null,chain:Promise.resolve()};
function lsGet(){try{const r=localStorage.getItem(LS_KEY);return r?JSON.parse(r):null}catch(e){return null}}
function lsSet(){try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}}
function mergeState(o){const d=DEFAULT_STATE();o=o||{};return{settings:{...d.settings,...(o.settings||{}),equip:{...d.settings.equip,...((o.settings||{}).equip||{})},voiceIds:{...((o.settings||{}).voiceIds||{})}},levels:{...d.levels,...(o.levels||{})},sessions:Array.isArray(o.sessions)?o.sessions:[],active:o.active||null}}
function setSync(kind,key){const el=document.getElementById("sync");el.dataset.k=key;el.dataset.c=kind;el.innerHTML=`<span class="dot ${kind}"></span><span>${t(key)}</span>`}
function queue(fn){store.chain=store.chain.then(fn).catch(e=>{console.warn(e);if(e&&e.code==="quota_exceeded")toast("Quota")});return store.chain}
let profTimer=null;
function profileDoc(){return{settings:S.settings,levels:S.levels,active:S.active,updated:Date.now()}}
function saveProfile(now){
  lsSet();if(store.mode!=="db")return;
  clearTimeout(profTimer);
  const run=()=>queue(()=>store.profRef.set(JSON.parse(JSON.stringify(profileDoc()))));
  if(now)run();else profTimer=setTimeout(run,600);
}
function saveSession(sess){lsSet();if(store.mode!=="db")return;queue(()=>store.profRef.collection("sessions").doc(sess.id).set(sess))}
function deleteSessionStore(id){lsSet();if(store.mode!=="db")return;queue(()=>store.profRef.collection("sessions").doc(id).delete())}
async function initStore(){
  const local=lsGet();if(local)S=mergeState(local);
  let db=null,user=null;
  try{if(window.claude&&window.claude.use){[db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")])}}catch(e){}
  let uid=null;try{uid=user?await user.id():null}catch(e){}
  if(!db||!uid){setSync("local","sync_local");return}
  store.db=db;store.uid=uid;store.profRef=db.doc("data/users/"+uid+"/profile");
  const timer=setTimeout(()=>setSync("local","sync_slow"),10000);
  try{
    const [p,q]=await Promise.all([store.profRef.get(),store.profRef.collection("sessions").orderBy("date","desc").limit(1000).get()]);
    clearTimeout(timer);store.mode="db";
    if(p.exists){
      const remote=p.data();const sessions=q.docs.map(d=>d.data()).filter(Boolean).reverse();
      const ids=new Set(sessions.map(s=>s.id));const extra=(S.sessions||[]).filter(s=>!ids.has(s.id));
      const localLang=S.settings.lang;
      S=mergeState({settings:remote.settings,levels:remote.levels,active:remote.active||S.active,sessions:[...sessions,...extra].sort((a,b)=>a.date<b.date?-1:1)});
      if(!S.settings.lang&&localLang)S.settings.lang=localLang;
      for(const s of extra)saveSession(s);
    }else{saveProfile(true);for(const s of S.sessions)saveSession(s)}
    lsSet();setSync("ok","sync_ok");
  }catch(e){clearTimeout(timer);console.warn(e);store.mode="local";setSync("local","sync_local")}
}

  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===view));

/* =========================================================
   8. GÉNÉRATEUR DE SÉANCE (corrigé : séries annoncées = séries réalisées)
   ========================================================= */
const REST={court:45,normal:70,long:100};
function estWork(g){if(g.type==="hold")return g.secs+5;const r=g.reps*(g.side?2:1);return Math.min(90,Math.max(20,r*3+6))}
function buildPlan(totalMin,focusId){
  const total=totalMin*60;
  const warm=Math.min(540,Math.max(135,Math.round(total*.15/45)*45));
  const cool=Math.min(360,Math.max(90,Math.round(total*.1/45)*45));
  const budget=total-warm-cool;
  const restBase=REST[S.settings.rest]||70;
  const steps=[];
  // échauffement
  for(let t0=0,i=0;t0+45<=warm;t0+=45,i++){const m=WARMUP[i%WARMUP.length];steps.push({kind:"warm",m,pose:m.p,dur:45})}
  // choix des exercices
  const focus=FOCUS.find(f=>f.id===focusId)||FOCUS[0];
  let fams=focus.fams.map(famById).filter(f=>f&&famAvailable(f));
  if(!fams.length)fams=["pompes","squat","gainage"].map(famById);
  const prev=S.sessions.filter(s=>s.focus===focus.id).length;
  if(fams.length>2){const sh=(prev*2)%fams.length;fams=[...fams.slice(sh),...fams.slice(0,sh)]}
  const mk=f=>{const lvl=S.levels[f.id]||0,st=f.steps[lvl];return{fam:f.id,cat:f.cat,lvl,p:st.p,g:st.g,sets:st.g.sets,work:estWork(st.g),rest:Math.round(restBase*(f.cat==="skill"?1.25:1))}};
  const per=it=>it.work+Math.round(it.rest*.8);
  const items=[];let used=0;
  const tryAdd=(f,sets)=>{const it=mk(f);it.sets=sets;const c=it.sets*per(it);if(used+c<=budget){items.push(it);used+=c;return true}return false};
  for(const f of fams){if(!tryAdd(f,3))tryAdd(f,2)}
  if(!items.length){const it=mk(fams[0]);it.sets=Math.max(1,Math.min(3,Math.floor(budget/per(it))));items.push(it);used+=it.sets*per(it)}
  const grow=max=>{let g=true;while(g){g=false;for(const it of items)if(it.sets<max&&used+per(it)<=budget){it.sets++;used+=per(it);g=true}}};
  grow(4);
  // familles d'appoint pour la variété plutôt que répéter le même exercice
  for(const fid of FILLERS){const f=famById(fid);if(!f||!famAvailable(f)||items.some(i=>i.fam===fid))continue;tryAdd(f,3)}
  grow(5);
  // séquence en supersets A1/B1/A2/B2…, numérotation basée sur le vrai total de séries
  const works=[];
  for(let i=0;i<items.length;i+=2){
    const pair=items.slice(i,i+2),mx=Math.max(...pair.map(p=>p.sets));
    for(let s=1;s<=mx;s++)for(const it of pair)if(s<=it.sets)works.push({kind:"work",fam:it.fam,lvl:it.lvl,pose:it.p,g:it.g,setNo:s,setsN:it.sets,est:it.work,dur:it.g.type==="hold"?it.g.secs:null,rb:it.rest});
  }
  works.forEach((w,k)=>{const nx=works[k+1];w.restAfter=nx&&nx.fam!==w.fam?Math.round(w.rb*.7):w.rb});
  works.forEach((w,k)=>{steps.push(w);if(k<works.length-1)steps.push({kind:"rest",dur:w.restAfter})});
  steps.push({kind:"rest",dur:20,toCool:true});
  for(let t0=0,i=0;t0+45<=cool;t0+=45,i++){const m=COOLDOWN[i%COOLDOWN.length];steps.push({kind:"cool",m,pose:m.p,dur:45})}
  const est=steps.reduce((a,s)=>a+(s.dur??s.est??0),0);
  return{steps,items,totalMin,focus:focus.id,est,warm,cool};
}
function showPlan(){
  const plan=buildPlan(S.settings.dur,S.settings.focus);const focus=FOCUS.find(f=>f.id===plan.focus);
  openModal(`<div class="kicker">${plan.totalMin} min · ${esc(tx(focus.n))}</div><h2 style="margin:4px 0 12px">${t("plan_title")}</h2>
  <div class="plan-row"><span class="tag" style="background:var(--gold)"></span><b>${t("warmup")}</b><span class="t">${fmt(plan.warm)}</span></div>
  ${plan.items.map(it=>{const f=famById(it.fam),st=f.steps[it.lvl];return `<div class="plan-row"><span class="tag" style="background:${catOf(f.cat).c}"></span><div><b>${esc(tx(st.n))}</b><div class="tiny">${tx(f.n)} · ${it.g.type==="hold"?it.g.secs+" s":it.g.reps+" "+t("reps_u")+(it.g.side?" "+t("per_side"):"")}</div></div><span class="t">${t("sets_n",{n:it.sets})}</span></div>`}).join("")}
  <div class="plan-row"><span class="tag" style="background:var(--teal)"></span><b>${t("cooldown")}</b><span class="t">${fmt(plan.cool)}</span></div>
  <p class="tiny" style="margin:12px 0">${t("plan_est",{m:Math.round(plan.est/60)})}</p>
  <div style="display:flex;gap:10px"><button class="btn" id="pCancel" style="flex:1">${t("plan_edit")}</button><button class="btn pri" id="pGo" style="flex:2">${t("plan_go")}</button></div>`);
  $("#pCancel").onclick=closeModal;$("#pGo").onclick=()=>{closeModal();startCoach(plan)};
}

/* =========================================================
   9. VOIX — sélection automatique de la voix la plus naturelle
   ========================================================= */
let actx=null,voices=[];
function initAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume()}catch(e){actx=null}}
function beep(freq=880,dur=.12,vol=.22){if(!S.settings.beeps||!actx)return;try{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=freq;o.type="sine";g.gain.setValueAtTime(vol,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+dur);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+dur)}catch(e){}}
function loadVoices(){try{voices=(speechSynthesis.getVoices()||[]).filter(v=>v&&v.name&&!/undefined/.test(v.name))}catch(e){voices=[]}}
try{speechSynthesis.onvoiceschanged=()=>{loadVoices();if(location.hash==="#reglages")renderSettings()};loadVoices()}catch(e){}
const NOVELTY=/(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Junior|Ralph|Kathy|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley)\b/i;
const REGIONS={fr:["fr-ca","fr-fr","fr-ch","fr-be"],en:["en-us","en-ca","en-gb","en-au"],es:["es-mx","es-us","es-es","es-419"]};
function vScore(v){
  const l=(v.lang||"").toLowerCase().replace("_","-"),tag=LANGS[LI];if(!l.startsWith(tag))return -999;
  const n=v.name||"";let s=0;
  if(/premium/i.test(n))s+=60;
  if(/enhanced|améliorée|amélioré|mejorada|natural|neural/i.test(n))s+=50;
  if(/google/i.test(n))s+=32;
  if(/online/i.test(n))s+=12;
  if(/siri/i.test(n))s+=10;
  if(/microsoft/i.test(n)&&!/online|natural/i.test(n))s-=12;
  if(/compact/i.test(n))s-=15;
  if(NOVELTY.test(n))s-=120;
  const ri=REGIONS[tag].findIndex(r=>l.startsWith(r));if(ri>=0)s+=8-ri*2;
  return s;
}
function bestVoice(){
  const id=(S.settings.voiceIds||{})[LANGS[LI]];
  if(id){const v=voices.find(v=>v.voiceURI===id||v.name===id);if(v)return v}
  let b=null,bs=-1e9;for(const v of voices){const sc=vScore(v);if(sc>bs){bs=sc;b=v}}
  return bs>-999?b:null;
}
const vQual=v=>{const s=vScore(v);return s>=40?"hi":s>=0?"mid":"lo"};
function say(txt,{interrupt=true,force=false}={}){
  coachMsg(txt);
  if(!S.settings.voice&&!force)return;
  try{
    if(interrupt)speechSynthesis.cancel();
    const v=bestVoice();
    const parts=txt.split(/(?<=[.!?…])\s+/).filter(Boolean);
    for(const p of parts){const u=new SpeechSynthesisUtterance(p);u.lang=v?v.lang:LOCALES[LI];if(v)u.voice=v;u.rate=S.settings.rate||1;u.pitch=S.settings.pitch||1;speechSynthesis.speak(u)}
  }catch(e){}
}
const pick=a=>a[Math.floor(Math.random()*a.length)];
const enc=k=>pick(ENC[k][LI]);
function coachMsg(x){const el=document.getElementById("coMsg");if(el)el.textContent=x}

/* =========================================================
   10. ENTRAÎNEUR GUIDÉ
   ========================================================= */
let C=null;
const exName=s=>s.kind==="work"?tx(stepOf(s.fam,s.lvl).n):tx(s.m.n);
const exCues=s=>s.kind==="work"?stepOf(s.fam,s.lvl).c.map(tx):s.m.c.map(tx);
function tgtSpoken(g){return g.type==="hold"?t("c_t_hold",{s:g.secs}):g.side?t("c_t_side",{r:g.reps}):t("c_t_reps",{r:g.reps})}
function tgtShown(g){return g.type==="hold"?t("hold_s",{s:g.secs}):t("reps_n",{r:g.reps})+(g.side?" "+t("per_side_l"):"")}
function startCoach(plan){
  initAudio();
  try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(l=>{if(C)C.lock=l}).catch(()=>{})}catch(e){}
  C={plan,idx:-1,stepStart:0,paused:false,pausedAt:0,pausedTotal:0,pausedTotalStep:0,startTs:Date.now(),log:[],pendingLog:null,timer:null,spoke:{},lock:null,id:"s"+Date.now().toString(36),date:new Date().toISOString()};
  $("#coach").classList.add("on");document.body.style.overflow="hidden";
  $("#coTotal").textContent=fmt(plan.est);
  say(t("c_welcome",{m:plan.totalMin,f:tx(FOCUS.find(f=>f.id===plan.focus).n).toLowerCase()}));
  nextStep(true);C.timer=setInterval(coachTick,200);
}
const now=()=>Date.now();
function stepElapsed(){if(!C)return 0;const p=C.paused?(now()-C.pausedAt):0;return(now()-C.stepStart-C.pausedTotalStep-p)/1000}
function totalElapsed(){if(!C)return 0;const p=C.paused?(now()-C.pausedAt):0;return(now()-C.startTs-C.pausedTotal-p)/1000}
const cur=()=>C.plan.steps[C.idx];
function nextNonRest(i){for(let k=i+1;k<C.plan.steps.length;k++){const s=C.plan.steps[k];if(s.kind!=="rest")return s}return null}
function nextStep(first){
  C.idx++;C.stepStart=now();C.pausedTotalStep=0;C.spoke={};
  if(C.idx>=C.plan.steps.length)return finishCoach(true);
  const s=cur();
  if(s.kind==="rest"&&s.dur<=0)return nextStep();
  renderCoach();
  const n=nextNonRest(C.idx);
  if(s.kind==="warm")say(`${exName(s)}. ${exCues(s)[0]}.`,{interrupt:!first});
  if(s.kind==="cool"){const prev=C.plan.steps[C.idx-1];say(prev&&prev.kind==="rest"?t("c_cool",{n:exName(s)}):`${exName(s)}. ${exCues(s)[0]}.`)}
  if(s.kind==="work"){
    C.pendingLog=null;
    const lastEx=!C.plan.steps.slice(C.idx+1).some(x=>x.kind==="work"),isLast=s.setNo===s.setsN;
    let msg=t("c_set",{a:s.setNo,b:s.setsN,n:exName(s),t:tgtSpoken(s.g)});
    if(s.setNo===1)msg+=" "+exCues(s)[0]+".";
    msg+=" "+(lastEx&&isLast?enc("lastEx"):isLast?enc("last"):enc("start"));
    say(msg);beep(1046,.18);
  }
  if(s.kind==="rest"){
    if(s.toCool)say(t("c_to_cool"));
    else if(n)say(enc("done")+" "+t("c_rest",{s:Math.round(s.dur),n:exName(n)}));
  }
}
function persistActive(){
  S.active={id:C.id,date:C.date,plannedMin:C.plan.totalMin,focus:C.plan.focus,log:C.log,elapsed:Math.round(totalElapsed())};
  saveProfile(true);
}
function logSet(actualSecs,early){
  const s=cur();
  const done=s.g.type==="hold"?Math.min(s.g.secs,Math.round(actualSecs)):s.g.reps;
  C.pendingLog={fam:s.fam,lvl:s.lvl,type:s.g.type,target:s.g.type==="hold"?s.g.secs:s.g.reps,side:!!s.g.side,done,secs:Math.round(actualSecs),setNo:s.setNo,setsN:s.setsN};
  C.log.push(C.pendingLog);persistActive();
}
function finishSet(){const s=cur();if(!s||s.kind!=="work")return;logSet(stepElapsed());nextStep()}
function skipStep(){
  if(C.paused)togglePause();
  const s=cur();
  if(s.kind==="work"){toast(t("skipped"));C.pendingLog=null}
  nextStep();
}
function coachTick(){
  if(!C||C.paused)return;const s=cur();if(!s)return;
  const el=stepElapsed();
  $("#coElapsed").textContent=fmt(totalElapsed());
  $("#coProg").style.width=Math.min(100,(C.idx/C.plan.steps.length)*100)+"%";
  const tEl=document.getElementById("coTimer");
  if(s.dur!=null){
    const left=s.dur-el;if(tEl)tEl.textContent=fmt(Math.ceil(left));
    const ring=document.getElementById("coRing");if(ring){const f=Math.max(0,Math.min(1,el/s.dur));ring.style.strokeDashoffset=(1-f)*ring._len}
    const Lft=Math.ceil(left);
    if(Lft<=3&&Lft>=1&&!C.spoke["b"+Lft]){C.spoke["b"+Lft]=1;beep(660,.1)}
    if(s.kind==="work"&&el>=s.dur/2&&!C.spoke.mid&&s.dur>=15){C.spoke.mid=1;say(enc("mid"))}
    if(s.kind==="rest"&&left<=10&&!C.spoke.ready&&s.dur>15){C.spoke.ready=1;const n=nextNonRest(C.idx);if(n&&n.kind==="work")say(t("c_prep",{n:exName(n)}))}
    if((s.kind==="warm"||s.kind==="cool")&&s.m.half&&el>=s.dur/2&&!C.spoke.mid){C.spoke.mid=1;say(t("c_switch"))}
    if(left<=0){beep(1320,.22);if(s.kind==="work")finishSet();else nextStep()}
  }else{
    if(tEl)tEl.textContent=fmt(el);
    if(el>s.est*1.8&&!C.spoke.nudge){C.spoke.nudge=1;say(t("c_nudge"))}
  }
}
function togglePause(){

function addRest(sec){const s=cur();if(s&&s.kind==="rest"){s.dur=Math.max(5,s.dur+sec);toast(t("rest_toast",{x:(sec>0?"+":"")+sec}))}}

function sessionTable(s){

function renderProgress(){
  const ss=S.sessions;

  $("#progStats").innerHTML=[[ss.length,t("st_sessions")],[Math.round(ss.reduce((a,s)=>a+(s.actualSec||0),0)/60),t("st_totmin")],[ss.reduce((a,s)=>a+(s.totalReps||0),0),t("st_reps")],[lv,t("st_steps")]].map(([v,l])=>`<div class="card stat"><div class="v">${v}</div><div class="l">${l}</div></div>`).join("");
  $("#histList").innerHTML=ss.length?[...ss].reverse().slice(0,100).map(s=>{const d=new Date(s.date),fo=FOCUS.find(f=>f.id===s.focus);
    const names=[];for(const x of s.sets){const st=stepOf(x.fam,x.lvl);const n=st?tx(st.n):x.fam;if(!names.includes(n))names.push(n)}
    return `<div class="hist" data-sid="${s.id}"><div class="d"><b>${d.getDate()}</b><span>${d.toLocaleDateString(loc(),{month:"short"})}</span></div><div style="flex:1;min-width:0"><b>${fo?esc(tx(fo.n)):""}</b> <span class="tiny">· ${fmt(s.actualSec)} · ${s.sets.length} ${t("sets")}${s.totalReps?" · "+s.totalReps+" "+t("reps_u"):""}</span><div class="tiny" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${names.map(esc).join(" · ")}</div></div>${s.completed?`<span class="pill teal">${t("complete")}</span>`:`<span class="pill">${t("partial")}</span>`}</div>`}).join(""):`<p class="muted" style="margin:0">${t("hist_empty")}</p>`;
  // graphique hebdomadaire
  const weeks=[],ws=weekStart(new Date());
  for(let k=9;k>=0;k--){const d=new Date(ws);d.setDate(d.getDate()-7*k);weeks.push({d,min:0})}
  for(const s of ss){const w=weekStart(new Date(s.date)).getTime();const e=weeks.find(x=>x.d.getTime()===w);if(e)e.min+=(s.actualSec||0)/60}
  const W=640,Hh=200,bw=W/weeks.length,nice=Math.ceil(Math.max(30,...weeks.map(w=>w.min))/30)*30;
  let bars="",grid="";
  for(let g=0;g<=3;g++){const y=Hh-24-(g/3)*(Hh-40);grid+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="#2a3342" stroke-dasharray="${g?"3 4":""}"/>`}
  weeks.forEach((w,i)=>{const h=(w.min/nice)*(Hh-40),x=i*bw+bw*.2,ww=bw*.6,cw=i===weeks.length-1;
    bars+=`<rect x="${x}" y="${Hh-24-h}" width="${ww}" height="${Math.max(h,1.5)}" rx="5" fill="${cw?"#ff6b35":"#2ec4b6"}" opacity="${w.min?1:.25}"/>`;
    if(w.min)bars+=`<text x="${x+ww/2}" y="${Hh-30-h}" text-anchor="middle" font-size="12" fill="#a7b1c2" font-family="Inter">${Math.round(w.min)}</text>`;
    bars+=`<text x="${x+ww/2}" y="${Hh-6}" text-anchor="middle" font-size="11" fill="#6f7b8f" font-family="Inter">${w.d.getDate()}/${w.d.getMonth()+1}</text>`});
  $("#weekChart").innerHTML=ss.length?`<svg viewBox="0 0 ${W} ${Hh}" style="width:100%;height:auto">${grid}${bars}</svg><div class="tiny">${t("chart_note")}</div>`:`<p class="muted" style="margin:0">${t("chart_empty")}</p>`;
  const famIds=[...new Set(ss.flatMap(s=>s.sets.map(x=>x.fam)))];
  $("#famTrends").innerHTML=famIds.length?famIds.map(fid=>{const f=famById(fid);if(!f)return"";
    const pts=ss.filter(s=>s.sets.some(x=>x.fam===fid)).map(s=>{const xs=s.sets.filter(x=>x.fam===fid);return{date:s.date,best:Math.max(...xs.map(x=>x.done)),lvl:xs[0].lvl,type:xs[0].type}}).slice(-20);
    return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>${tx(f.n)}</b><span class="pill" style="color:${catOf(f.cat).c}">${esc(tx(f.steps[S.levels[fid]||0].n))}</span></div>${spark(pts,f)}</div>`}).join(""):`<div class="card muted">${t("trend_empty")}</div>`;
}

function spark(pts,f){
  if(!pts.length)return"";const W=300,H=90,p=12,mx=Math.max(...pts.map(x=>x.best),1);
  const X=i=>pts.length===1?W/2:p+i*(W-2*p)/(pts.length-1),Y=v=>H-p-(v/mx)*(H-2*p-8);
  const path=pts.map((q,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(q.best).toFixed(1)).join("");
  const dots=pts.map((q,i)=>{const c=i>0&&q.lvl!==pts[i-1].lvl;return `<circle cx="${X(i).toFixed(1)}" cy="${Y(q.best).toFixed(1)}" r="${c?5:3.2}" fill="${c?"#b8f55a":"#ff6b35"}"/>`}).join("");
  const last=pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin-top:6px"><path d="${path}" fill="none" stroke="#ff6b35" stroke-width="2.2" stroke-linejoin="round"/>${dots}</svg><div class="tiny">${t("last_x",{x:last.best+(last.type==="hold"?" s":" "+t("reps_u"))})} · ${t("lvl_dot")}</div>`;
}

  if(!S.settings.lang)langPicker(afterLang);else afterLang();
})();

if("serviceWorker" in navigator&&location.protocol.startsWith("http")){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
